<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>게시글 등록</title>
        <!-- Favicon-->
        <link rel="icon" type="image/png" href="../assets/icons/common/푸른발자국.png" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <!--폰트-->
        <link href="../css/styles.css" rel="stylesheet" />
        <link href="../css/community.css" rel="stylesheet" />
        <link rel="stylesheet" href="../css/css.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Pacifico&display=swap" rel="stylesheet">
        <style>
        * {
            font-family: "Gowun Dodum", sans-serif;
        }
            #registerBtn {
                display: inline-block;
                min-width: 80px;
                margin-left: 10px;
                padding: 10px;
                border: 1px solid #000;
                border-radius: 2px;
                font-size: 1.4rem;
                background: #476e37;
                color: #fff;
            }
    </style>
    </head>
    <body>
        <!-- Navigation-->
        <div id="communityNav"></div>
        <!-- Product section-->
        <section class="community_py-5">
            <div class="board_wrap">
                <div class="board_title">
                    <strong>현지인과 소통하는 색다른 커뮤니티!</strong>
                    <p>현지주민들과 다양한 이야기를 나누어 보세요!!</p>
                </div>
                <div class="board_write_wrap">
                    <div class="board_write">
                        <div class="title">
                            <dl>
                                <dt>제목</dt>
                                <dd><input type="text" placeholder="제목 입력"></dd>
                            </dl>
                        </div>
                        <div class="info">
                            <dl>
                                <dt>글쓴이</dt>
                                <dd><input type="text" placeholder="글쓴이 입력"></dd>
                            </dl>
                            <dl>
                                <dt>비밀번호</dt>
                                <dd><input type="password" placeholder="비밀번호 입력"></dd>
                            </dl>
                        </div>
                        <div class="cont">
                            <textarea placeholder="내용 입력"></textarea>
                        </div>
                    </div>
                    <div class="bt_wrap">
                        <button id="registerBtn" class="on">등록</button>
                        <a href="communitylist.html">취소</a>
                    </div>
                </div>
        </div>
        </section>
        <!-- Footer-->


        </footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

        <script src="../js/community_nav.js"></script>
        <script src="../js/scripts.js"></script>
        <script src="../js/community_write.js"></script>
